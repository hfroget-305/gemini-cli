name: 'PR Size and Complexity Labeler'

# Deterministic labeler. Runs on pull_request_target with a GitHub App
# token, so PR diff content MUST NOT be passed to an LLM — prompt
# injection inside the diff would let any fork PR steer the model into
# editing labels/comments on other PRs. This workflow uses the GitHub
# API stats (additions, deletions, changed_files) only.

on:
  pull_request_target:
    types: ['opened', 'reopened', 'synchronize']

jobs:
  label-pr:
    timeout-minutes: 5
    if: |-
      ${{ github.repository == 'google-gemini/gemini-cli' }}
    permissions:
      pull-requests: 'write'
      contents: 'read'

    concurrency:
      group: '${{ github.workflow }}-${{ github.event.pull_request.number }}'
      cancel-in-progress: true

    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Generate GitHub App Token'
        id: 'generate_token'
        uses: 'actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e' # v2
        with:
          app-id: '${{ secrets.APP_ID }}'
          private-key: '${{ secrets.PRIVATE_KEY }}'
          permission-issues: 'write'

      - name: 'Apply size and complexity labels'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # v7
        env:
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        with:
          github-token: '${{ steps.generate_token.outputs.token }}'
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });

            const linesChanged = (pr.additions || 0) + (pr.deletions || 0);
            const filesChanged = pr.changed_files || 0;

            let sizeLabel;
            if (linesChanged < 10) sizeLabel = 'size/xs';
            else if (linesChanged <= 50) sizeLabel = 'size/s';
            else if (linesChanged <= 200) sizeLabel = 'size/m';
            else if (linesChanged <= 1000) sizeLabel = 'size/l';
            else sizeLabel = 'size/xl';

            const complexityLabel =
              filesChanged <= 3 && linesChanged <= 50
                ? 'review/quick'
                : 'review/involved';

            const SIZE_LABELS = ['size/xs', 'size/s', 'size/m', 'size/l', 'size/xl'];
            const REVIEW_LABELS = ['review/quick', 'review/involved'];

            const currentLabels = new Set((pr.labels || []).map((l) => l.name));

            for (const label of SIZE_LABELS) {
              if (label !== sizeLabel && currentLabels.has(label)) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: label,
                }).catch(() => {});
              }
            }
            for (const label of REVIEW_LABELS) {
              if (label !== complexityLabel && currentLabels.has(label)) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: label,
                }).catch(() => {});
              }
            }

            const toAdd = [];
            if (!currentLabels.has(sizeLabel)) toAdd.push(sizeLabel);
            if (!currentLabels.has(complexityLabel)) toAdd.push(complexityLabel);
            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber, labels: toAdd,
              });
            }

            core.info(
              `PR #${prNumber}: ${linesChanged} lines, ${filesChanged} files ` +
              `→ ${sizeLabel}, ${complexityLabel}`,
            );

            if (sizeLabel === 'size/xl' && pr.state === 'open') {
              const MARKER = '<!-- size-xl-advice -->';
              // Fast path: if the PR was already size/xl on the previous
              // run, the advisory comment has already been posted (or
              // explicitly suppressed by a maintainer) and we don't need
              // to re-scan every comment on every push. Only paginate
              // when this is the FIRST time the PR is being marked xl.
              const wasAlreadyXl = currentLabels.has('size/xl');
              let alreadyPosted = wasAlreadyXl;
              if (!wasAlreadyXl) {
                // Paginate across all comments — listComments returns one
                // page at a time, so on a long-running PR the marker can
                // sit on page 2+ and we'd re-post the advisory every run.
                const comments = await github.paginate(
                  github.rest.issues.listComments,
                  { owner, repo, issue_number: prNumber, per_page: 100 },
                );
                alreadyPosted = comments.some((c) =>
                  (c.body || '').includes(MARKER),
                );
              }
              if (!alreadyPosted) {
                const body =
                  MARKER + '\n' +
                  'Thanks for your hard work on this pull request!\n\n' +
                  'This pull request is quite large, which can make it ' +
                  'challenging and time-consuming for reviewers to go ' +
                  'through thoroughly.\n\n' +
                  'To help us review it more efficiently and get your ' +
                  'changes merged faster, we kindly request you consider ' +
                  'breaking this into smaller, more focused pull requests. ' +
                  'Each smaller PR should ideally address a single logical ' +
                  'change or a small set of related changes.\n\n' +
                  'For example, you could separate out refactoring, new ' +
                  'feature additions, and bug fixes into individual PRs. ' +
                  'This makes it easier to understand, review, and test ' +
                  'each component independently.\n\n' +
                  'We appreciate your understanding and cooperation. Feel ' +
                  'free to reach out if you need any assistance with this!';
                await github.rest.issues.createComment({
                  owner, repo, issue_number: prNumber, body,
                });
              }
            }
